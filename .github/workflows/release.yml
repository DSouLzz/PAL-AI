name: Build and publish PAL-AI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.8.7"
        required: true
        default: "0.8.7"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="PAL-AI-v${VERSION}"
          mkdir "$STAGE"
          cp pal_ai.py launcher.py voice_fix.py map_overlay.py map_precision.py map_pin_fix.py performance_patch.py online_research.py activity_indicator.py updater.py requirements.txt install.bat start.bat debug_start.bat apply_update.bat VERSION README.md TROUBLESHOOTING.md config.example.json "$STAGE"/
          mkdir -p "$STAGE/knowledge"
          cp knowledge/PALWORLD_NOTES.md "$STAGE/knowledge/"
          cp config.example.json "$STAGE/config.json"
          printf '%s\n' "$VERSION" > "$STAGE/VERSION"
          python -c 'import json,sys; p=sys.argv[1]; v=sys.argv[2]; c=json.load(open(p,encoding="utf-8")); c["app_version"]=v; json.dump(c,open(p,"w",encoding="utf-8"),indent=2,ensure_ascii=False)' "$STAGE/config.json" "$VERSION"
          zip -r "PAL-AI-v${VERSION}.zip" "$STAGE"
          sha256sum "PAL-AI-v${VERSION}.zip" > "PAL-AI-v${VERSION}.zip.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ZIP="PAL-AI-v${VERSION}.zip"
          SHA="PAL-AI-v${VERSION}.zip.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --title "PAL-AI v${VERSION}" \
              --generate-notes
          fi
